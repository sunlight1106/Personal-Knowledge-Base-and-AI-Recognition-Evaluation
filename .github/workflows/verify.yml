name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  startup-scripts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./scripts/test-docker-preflight.ps1
          ./scripts/test-start-project.ps1
      - if: runner.os == 'Linux'
        run: sh scripts/test-start-project.sh
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: cle/package-lock.json
      - run: npm ci --prefix cle
      - run: npm audit --prefix cle --audit-level=high
      - run: npm run test:unit --prefix cle
      - run: npm run test:ui --prefix cle
      - run: npm run build --prefix cle
      - name: Validate browser security headers and private request logs
        run: bash scripts/tests/nginx-log-smoke.sh
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ./mvnw -B verify
  mysql-contract:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: isolated-ci-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysql -h127.0.0.1 -uroot -pisolated-ci-only -e 'SELECT 1'"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw -B -Dtest=PermissionMatrixMySqlIntegrationTest,ModerationMySqlIntegrationTest,AccountSecurityMySqlIntegrationTest,GroupLifecycleMySqlIntegrationTest,GroupCommunicationMySqlIntegrationTest,PersonalWorkflowMySqlIntegrationTest,ResearchWorkspaceMySqlIntegrationTest,AdministrationMySqlIntegrationTest,MySqlSchemaMigrationTest,BillingConcurrencyIntegrationTest,NoteReferenceBatchQueryTest,VocabularyMySqlIntegrationTest,AdminMutationConcurrencyIntegrationTest,PersonalPlatformHttpIntegrationTest,InferenceRecoveryIntegrationTest,PersonalAiPersistenceIntegrationTest,PlatformCompletionMySqlIntegrationTest,CodeLabMySqlIntegrationTest test
        env:
          MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&rewriteBatchedStatements=true
          MYSQL_TEST_USERNAME: root
          MYSQL_TEST_PASSWORD: isolated-ci-only

  redis-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: python scripts/tests/run-redis-contracts.py

  backup-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/backup/requirements.txt
      - run: python -m unittest discover -s scripts/backup -p 'test_*.py' -v
      - run: python -m unittest discover -s scripts -p test_startup.py -v
      - run: python scripts/release/test_install.py
      - run: python scripts/ops/test_rolling_deploy.py

  training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/training/requirements.txt
      - run: pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r ai/training/requirements.txt
      - run: python -m unittest -v test_training
        working-directory: ai/training
  code-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/code-lab/requirements.txt
      - run: pip install -r src/code-lab/requirements.txt
      - run: python -m unittest -v test_engine test_analysis test_server
        working-directory: src/code-lab
