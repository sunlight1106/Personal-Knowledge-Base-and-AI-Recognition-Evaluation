groups:
  - name: platform
    rules:
      - alert: PlatformTargetDown
        expr: up{job="platform"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Application metrics unavailable for two minutes"}
      - alert: PlatformErrors
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001) > 0.01
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Server errors exceed one percent"}
      - alert: PlatformSlowRequests
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{uri!="/api/v1/notifications/events"}[5m]))) > 0.5
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "P95 request duration exceeds 500 ms"}
      - alert: PlatformDiskLow
        expr: disk_free_bytes / disk_total_bytes < 0.1
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Application filesystem free space below ten percent"}
